---
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    # Mandatory field. We allow uv to install Python to avoid manual
    # duplication, but latest is usually the correct version.
    python: latest
  jobs:
    create_environment:
      # Need the tags to calculate the version.
      - git fetch --tags

      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest

    build:
      html:
        # Set canonical URL
        - sed -i "s|https://pgbg.hynek.me/|$READTHEDOCS_CANONICAL_URL|g" zensical.toml
        - uvx --with tox-uv-bare tox run -e docs-build
        # Zensical builds into site/; hand it to Read the Docs.
        # https://docs.readthedocs.com/platform/latest/intro/zensical.html
        - mkdir -p $READTHEDOCS_OUTPUT/html/
        - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
